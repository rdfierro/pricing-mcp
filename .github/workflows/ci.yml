name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,evals]"
      - run: ruff check .
      - name: Unit tests and grader tests
        run: pytest -q
      - name: Tool evals against ground truth
        run: python -m evals.tool_evals
      - name: Data is reproducible
        run: |
          python scripts/generate_data.py
          git diff --exit-code -- src/pricing_mcp/data evals/ground_truth.json
